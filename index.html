          font-weight:600;
          letter-spacing:0.08em;
          line-height:1;
          color:#6e6e73;

        }
        .headline{

          font-style:italic;
          font-weight:400;
          letter-spacing:-0.02em;
          display:inline-block;
          transform:translateY(-1px);
        }
        .sub{
          max-width:600px;
          margin:20px auto 0;
          font-size:17px;
          line-height:1.5;
          color:#6e6e73;
          font-weight:400;
          letter-spacing:-0.01em;
        }
        @media(max-width:600px){

        }
        .cta-row{
          display:flex;
          gap:10px;
          justify-content:center;
          align-items:center;
          margin-top:30px;
          flex-wrap:wrap;
        }
        .btn{
          appearance:none;
          display:inline-flex;
          align-items:center;
          justify-content:center;
          border-radius:999px;
          padding:14px 24px;
          font-size:15px;
          font-weight:600;
          letter-spacing:-0.01em;
          line-height:1;
          text-decoration:none;
          cursor:pointer;
          transition:transform 0.16s ease, opacity 0.16s ease, background 0.16s ease, border-color 0.16s ease;
          -webkit-tap-highlight-color:transparent;
          user-select:none;
          white-space:nowrap;
        }
        .btn:active{transform:scale(0.97)}
        .btn-black{
          background:#000;
          color:#fff;
          border:1px solid #000;
        }
        .btn-black:hover{opacity:0.88}
        .btn-white{
          background:#fff;
          color:#000;
          border:1px solid #d2d2d7;
        }
        .btn-white:hover{background:#f5f5f7;border-color:#c7c7cc}
        .status-wrap{
          display:flex;
          justify-content:center;
          padding:0 24px;
          margin-top:56px;
        }
        .status-inner{
          display:inline-flex;
          align-items:center;
          gap:8px;
          border:1px solid #e8e8e8;
          background:#fff;
          border-radius:999px;
          padding:8px 14px;
        }
        .dot{
          width:6px;
          height:6px;
          border-radius:50%;
          background:#16a34a;
          box-shadow:0 0 0 0 rgba(22,163,74,0.28);
          animation:dotPulse 2.2s infinite;
          flex-shrink:0;
        }
        @keyframes dotPulse{
          0%{box-shadow:0 0 0 0 rgba(22,163,74,0.28)}
          70%{box-shadow:0 0 0 6px rgba(22,163,74,0)}
          100%{box-shadow:0 0 0 0 rgba(22,163,74,0)}
        }
        .status-text{
          font-size:11px;
          font-weight:650;
          letter-spacing:0.07em;
          color:#1d1d1f;
          line-height:1;
        }
        .pricing{

          gap:16px;
          margin-top:34px;
          align-items:stretch;
        }
        @media(max-width:900px){

        }

          background:#000;
          border-color:#000;

          font-weight:600;

          font-size:15px;
          font-weight:600;
          letter-spacing:-0.02em;
        }
