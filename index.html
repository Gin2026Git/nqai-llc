hones it.",tags:["zomi","burmese","spanish","200"]},{id:"start1",cat:"How to Start",q:"How do I start? Self-serve, no call needed?",a:"Completely self-serve like Google. 1) Pick plan at nqai.llc/web 2) Pay via Stripe 3) Get instant bridge PIN + US number access 4) Call. No sales call, no onboarding meeting. Turnkey AI service. Self-funded, so we built it to run without human contact.",tags:["self-serve","stripe","start"]},{id:"start2",cat:"How to Start",q:"Do I need an app or smartphone?",a:"No. Any phone works — flip phone, landline, village phone. If you can call +1 (615) 235-5215, you can use NqAI. Web option at nqai.llc/web is for browsers, but phone-to-phone is core. Worldwide mind, start small.",tags:["phone","app","web"]},{id:"start3",cat:"How to Start",q:"What numbers do I call?",a:"HQ US: +1 (615) 235-5215 (Smyrna TN 37167). Toll-free: 1-833-NQAI (1-833-6724) FREE. Both route to same NLLB+Web bridge. Save both. Worldwide callers dial US number — we bridge to destination via Web.",tags:["number","toll-free","smyrna"]},{id:"call1",cat:"How to Call",q:"How do I make a worldwide call, step-by-step?",a:"Example: You speak Zomi, friend speaks Burmese. 1) Dial +1 (615) 235-5215, enter PIN 2) Say 'Call +95...' or select language pair on keypad 3) System: Whisper listens Zomi → NLLB-200 translates to Burmese → TTS speaks Burmese to other phone 4) Other phone hears Burmese, replies in Burmese → reverse path. Normal phone hold.",tags:["how to call","zomi","burmese"]},{id:"call2",cat:"How to Call",q:"Can I use it for business and politics?",a:"Yes. Politics, business, personal — normal phone use. No 'AI conference' setup. You call as usual, AI translates in middle. Many users: Myanmar community organizing, Mexico business suppliers, church family calls. Worldwide.",tags:["business","politics","use case"]},{id:"call3",cat:"How to Call",q:"What about worldwide codes like Burma +95 Mexico +52?",a:"We support full E.164 dialing. Examples active: Burma/Myanmar +95, Mexico +52, US +1, Spain +34, Malaysia +60, India +91, Thailand +66. Dial +country + number after bridge prompt. Web at nqai.llc/web shows live routes.",tags:["worldwide","country code"]},{id:"fix1",cat:"Fix Problems",q:"Call quality bad or translation wrong — self-fix?",a:"Self-fix like Google Help: 1) Speak slower, reduce background noise — Whisper needs clear audio 2) In FAQ search 'fix' — we auto-detect language mismatch, retry NLLB-200 3) Redial bridge — AI resets session 4) Check minutes balance at nqai.llc/web/billing. No human support to call — FAQ completely.",tags:["fix","quality","self-fix"]},{id:"fix2",cat:"Fix Problems",q:"I ran out of minutes mid-call?",a:"AI auto-announces '2 mins left' via TTS. If call drops, top up instantly at nqai.llc/web — Stripe adds minutes in <60 sec. AI Turnkey: Stripe auto, no human approval. Self-funded so we don't gate top-ups.",tags:["minutes","stripe","billing"]},{id:"fix3",cat:"Fix Problems",q:"Why does NqAI block my call sometimes?",a:"AI guardrail admin (10 mins daily) — system auto-blocks spam/abuse, scam patterns, robocall reuse. Protects Twilio US numbers. If blocked incorrectly, wait 15 mins and retry. Built to run without humans — less personal contact by design.",tags:["block","guardrail","abuse"]},{id:"priv1",cat:"Privacy & Legal",q:"Privacy? Do you store my calls?",a:"We store: call logs (numbers, duration, minutes) for Stripe billing, and transient Whisper/NLLB logs for <24h debugging, then auto-delete. No selling data. Transcripts not used to train. See nqai.llc/privacy. Meta AI NLLB-200 runs on our infra — not sent to Meta for training.",tags:["privacy","meta","data"]},{id:"priv2",cat:"Privacy & Legal",q:"Money: Are you VC funded? Will you shut down like Skype?",a:"Self-funded. No investors. Stripe cash flow pays Twilio + servers. Skype died May 2025 — we own Phone-(NLLB+Web)-Phone category because we stay small, worldwide mind, start small. Pricing $11.99 / $49.99 / $99.99 covers cost. No investor needed.",tags:["money","self-funded","skype"]},{id:"priv3",cat:"Privacy & Legal",q:"Why no phone support to contact human? Like Google?",a:"AI Turnkey with less personal contact: AI support bot + Google-style FAQ + Stripe auto + AI abuse block + human guardrail admin 10 mins daily only. Like Google — no one can call or talk or chat human. Self-serve completely. Keeps costs low and service stable worldwide.",tags:["support","google","turnkey"]}],cc=[{code:"+95",name:"Myanmar / Burma",lang:"Burmese / Zomi",x:78,y:42},{code:"+52",name:"Mexico",lang:"Spanish",x:18,y:45},{code:"+1",name:"USA Smyrna TN",lang:"English",x:22,y:32,hq:!0},{code:"+34",name:"Spain",lang:"Spanish",x:48,y:36},{code:"+91",name:"India",lang:"Hindi",x:71,y:48},{code:"+60",name:"Malaysia",lang:"Malay",x:80,y:62},{code:"+66",name:"Thailand",lang:"Thai",x:77,y:54},{code:"+81",name:"Japan",lang:"Japanese",x:88,y:35}];function ki(){let[e,t]=Be.useState(""),[n,r]=Be.useState("All"),[l,u]=Be.useState("what1"),[o,i]=Be.useState("family"),[s,p]=Be.useState({name:"",phone:"",lang:"Zomi",agree:!1}),[m,y]=Be.useState("idle"),[h,w]=Be.useState(!1),E=Be.useMemo(()=>{return X0.filter((f)=>{let c=n==="All"||f.cat===n,v=e.toLowerCase(),g=!v||f.q.toLowerCase().includes(v)||f.a.toLowerCase().includes(v)||f.tags.some((_)=>_.includes(v));return c&&g})},[e,n]),k=(f)=>{w(!0),setTimeout(()=>w(!1),2500);try{let c=window.AudioContext||window.webkitAudioContext;if(c){let v=new c,g=v.createOscillator(),_=v.createGain();g.frequency.value=880,_.gain.value=0.0001,g.connect(_),_.connect(v.destination),g.start(),_.gain.exponentialRampToValueAtTime(0.08,v.currentTime+0.01),_.gain.exponentialRampToValueAtTime(0.0001,v.currentTime+0.12),g.stop(v.currentTime+0.13)}}catch{}},F=(f="family")=>{i(f),k("start");let c=document.getElementById("pricing");if(c)c.scrollIntoView({behavior:"smooth",block:"start"});if(window.location.hash!=="#pricing")history.replaceState(null,"","#pricing")};return d("div",{className:"min-h-screen bg-[var(--bg)] text-[var(--text)
