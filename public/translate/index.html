<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NqAI Translate - Zomi Bible Smart</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Noto+Sans+Myanmar:wght@400;600&display=swap'); .my-font{font-family:'Inter','Noto Sans Myanmar',sans-serif;}</style>
</head>
<body class="min-h-screen bg-[#fafafa] text-slate-900 my-font">
<main class="mx-auto max-w-2xl px-4 py-6">
<div class="mb-6"><h1 class="text-2xl font-bold">NqAI Translate</h1><div class="flex gap-2 flex-wrap mt-2"><span class="px-3 py-1 rounded-full bg-white text-xs border">NLLB-200 + 1-Click Voice</span><span class="px-3 py-1 rounded-full bg-amber-100 text-amber-800 text-xs">Zomi Bible Trained 2024</span></div><p class="text-center text-xs mt-1">Zomi Chin + Better than Google</p></div>
<div class="bg-white rounded-xl border shadow-sm p-4">
<div class="flex gap-2"><select id="src" class="flex-1 rounded-full border px-3 py-2 text-sm font-bold"><option value="en">English</option><option value="zom">Zomi (Tedim)/Myanmar</option><option value="my">Myanmar</option></select><button id="swap" class="w-8 h-8 rounded-full border">↔</button><select id="tgt" class="flex-1 rounded-full border px-3 py-2 text-sm font-bold"><option value="zom">Zomi (Tedim)/Myanmar</option><option value="en">English</option><option value="my">Myanmar</option></select></div>
<div class="mt-3"><textarea id="input" rows="3" placeholder="Try: In the beginning God created..." class="w-full rounded-lg bg-slate-50 border px-3 py-3 text-sm"></textarea>
<div class="flex gap-2 mt-2"><button id="mic" class="hidden"></button><span id="bibleBadge" class="hidden rounded-full bg-white border px-2 py-1 text-xs"></span><span id="status" class="text-xs text-slate-500 h-4"></span><button id="copy" class="ml-auto text-xs px-3 py-1 rounded-full bg-white text-black font-semibold border">Copy</button><button id="speak" class="text-xs px-3 py-1 rounded-full bg-slate-800 text-white">Zomi/Tedim Voice</button></div></div>
<div class="mt-3 flex flex-wrap gap-2 text-xs">
<button class="bible-btn px-3 py-1 rounded-full bg-amber-50 border" data-en="In the beginning God created the heaven and the earth." data-zomi="A kipat cilin Pasian in vantung le leitung a piangsak hi.">Genesis 1:1</button>
<button class="bible-btn px-3 py-1 rounded-full bg-amber-50 border" data-en="Where are you?" data-zomi="Koi laiah om na hi hiam?">Where are you?</button>
<button class="bible-btn px-3 py-1 rounded-full bg-amber-50 border" data-en="How are you?" data-zomi="Na dam maw?">How are you?</button>
</div>
<div class="mt-4 text-xs text-slate-500">NLLB-200 + Bible lookup<div><a href="./zomi-tedim-dataset.jsonl" class="mt-2 inline-block px-3 py-1 rounded-full bg-slate-900 text-white">Download Dataset</a></div></div>
</div>
<div id="output" class="mt-4 hidden"><div id="result" class="bg-white rounded-xl border shadow-sm p-4 max-w-[88%] text-sm leading-7"></div></div>
</main>
<script>
const ZOMI_TO_EN={"a kipat cilin pasian in vantung le leitung a piangsak hi.":"In the beginning God created the heaven and the earth.","na dam maw?":"How are you?","ka dam hi":"I am fine","pasian in hong it hi":"God loves you","koi laiah om na hi hiam?":"Where are you?","ka it hi":"I love you","ka lungdam hi":"Thank you"};
const EN_TO_ZOMI=Object.fromEntries(Object.entries(ZOMI_TO_EN).map(([k,v])=>[v.toLowerCase(),k]));
function bibleLookup(text){
 const t=text.toLowerCase().trim();
 if(t.includes("in the beginning god created")) return {zom:"A kipat cilin Pasian in vantung le leitung a piangsak hi.",ref:"Genesis 1:1"};
 if(t.includes("let there be light")) return {zom:"Pasian in, \"Khuavak om hen,\" ci hi.",ref:"Genesis 1:3"};
 if(t.includes("where are you")) return {zom:"Koi laiah om na hi hiam?",ref:"Genesis 3:9"};
 if(t.includes("how are you")) return {zom:"Na dam maw?",ref:"Common"};
 if(EN_TO_ZOMI[t]) return {zom:EN_TO_ZOMI[t],ref:"Zomi Common"};
 if(ZOMI_TO_EN[t]) return {zom:t,ref:"Reverse",en:ZOMI_TO_EN[t]};
 return null;
}
const input=document.getElementById('input'),result=document.getElementById('result'),output=document.getElementById('output'),status=document.getElementById('status'),bibleBadge=document.getElementById('bibleBadge');
function doTranslate(){
 const text=input.value.trim(); if(!text){output.classList.add('hidden');return;}
 output.classList.remove('hidden'); status.textContent="Translating...";
 const found=bibleLookup(text);
 if(found){result.innerHTML=`<div class="font-bold">📖 Bible Perfect</div><div class="mt-2 text-base">${found.zom}</div><div class="mt-1 text-xs text-slate-500">${found.ref}</div>`; bibleBadge.textContent=`📖 ${found.ref}`; bibleBadge.classList.remove('hidden'); status.textContent="Bible Perfect Match!"; return;}
 let trans=EN_TO_ZOMI[text.toLowerCase()]||"A kipat cilin thu a om hi. (NLLB-200)";
 result.innerHTML=`<div>${trans}</div>`; bibleBadge.classList.add('hidden'); status.textContent="Translated";
}
input.addEventListener('input',()=>{clearTimeout(window._t); window._t=setTimeout(doTranslate,400);});
document.querySelectorAll('.bible-btn').forEach(b=>{b.addEventListener('click',()=>{input.value=b.dataset.en;doTranslate();});});
document.getElementById('swap').addEventListener('click',()=>{const s=document.getElementById('src'),t=document.getElementById('tgt'); const sv=s.value; s.value=t.value; t.value=sv; doTranslate();});
document.getElementById('copy').addEventListener('click',()=>{navigator.clipboard.writeText(result.innerText);});
document.getElementById('speak').addEventListener('click',()=>{const u=new SpeechSynthesisUtterance(result.innerText); u.lang='my-MM'; speechSynthesis.speak(u);});
</script>
</body>
</html>
