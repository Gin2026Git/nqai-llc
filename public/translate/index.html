<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NqAI Translate - 1-Click Voice</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>*{font-family:Inter,sans-serif}@keyframes wave{0%,100%{transform:scaleY(.5)}50%{transform:scaleY(1.4)}}@keyframes pulseRing{0%{transform:scale(.8);opacity:.7}100%{transform:scale(2.2);opacity:0}}.wave-bar{animation:wave .7s ease-in-out infinite}</style>
</head>
<body class="min-h-screen bg-[#fafafa] text-slate-900">
<div class="max-w- mx-auto px-4 py-8">
<div class="text-center mb-7">
<h1 class="text- font-extrabold">NqAI Translate</h1>
<div class="mt-2 inline-flex items-center gap-2 px-3 py-1 rounded-full bg-slate-900 text-white text- font-semibold"><span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>Powered by NLLB-200 • 1-Click Voice</div>
<p class="mt-2 text- text-slate-500">Better than Google — No second tap!</p>
</div>
<div class="bg-white rounded- shadow border overflow-hidden">
<div class="flex items-center gap-2 px-4 py-3 bg-slate-50 border-b">
<select id="src" class="flex-1 bg-white border rounded-full px-3.5 py-2 text- font-semibold"><option value="zom">Zomi</option><option value="ted">Tedim</option><option value="hac">Hakha</option><option value="tcz">Falam</option><option value="my">Burmese</option><option value="en">English</option></select>
<button id="swap" class="w-9 h-9 rounded-full bg-white border">⇄</button>
<select id="tgt" class="flex-1 bg-white border rounded-full px-3.5 py-2 text- font-semibold"><option value="en">English</option><option value="zom">Zomi</option><option value="ted">Tedim</option><option value="hac">Hakha</option><option value="my">Burmese</option></select>
</div>
<div class="p-4">
<textarea id="input" rows="3" placeholder="Type or tap mic..." class="w-full resize-none rounded- bg-slate-50 border px-4 py-3.5 text- outline-none focus:bg-white"></textarea>
<div id="history" class="mt-4 space-y-2 max-h- overflow-auto hidden"></div>
<div class="mt-4 rounded- bg-slate-900 text-white p-4">
<div id="out" class="text- text-slate-300">Translation appears here...</div>
<div class="mt-3 flex gap-2"><span id="badge" class="text- px-2 py-0.5 rounded-full bg-white/10 border">NLLB-200 ready</span><button id="copy" class="ml-auto text- px-2.5 py-1 rounded-full bg-white text-slate-900 font-semibold">Copy</button><button id="speak" class="text- px-2.5 py-1 rounded-full bg-white/10 border">🔊 Speak</button></div>
</div>
<div class="mt-6 flex flex-col items-center">
<div class="relative"><div id="pulse" class="absolute inset-0 rounded-full border border-red-400 hidden" style="animation:pulseRing 1.6s infinite"></div><button id="mic" class="relative w- h- rounded-full bg-slate-900 text-white grid place-items-center">🎤</button></div>
<div id="micLabel" class="mt-3 text-center"><div class="text- font-bold">1-Click Conversation</div><div class="text- text-slate-500">Tap once • Auto both ways • No second tap!</div></div>
<div id="status" class="mt-2 text- h-4"></div>
</div>
<button id="go" class="mt-6 w-full h- rounded-full bg-slate-900 text-white font-semibold">Translate • Enter</button>
</div>
</div>
<div class="text-center mt-5 text- text-slate-400">NqAI Burmese AI • No Language Left Behind</div>
</div>
<script>
const $=id=>document.getElementById(id);const src=$('src'),tgt=$('tgt'),inp=$('input'),out=$('out'),badge=$('badge'),hist=$('history'),status=$('status'),mic=$('mic'),pulse=$('pulse'),micLabel=$('micLabel');let listening=false,recog=null;
function addBubble(me,t){hist.classList.remove('hidden');const w=document.createElement('div');w.className=me?'flex justify-end':'flex justify-start';const b=document.createElement('div');b.className=(me?'bg-slate-900 text-white':'bg-slate-100')+' max-w-[80%] rounded- px-3.5 py-2 text-';b.textContent=t;w.appendChild(b);hist.appendChild(w);}
function setListening(on){listening=on;if(on){mic.classList.add('bg-red-600');pulse.classList.remove('hidden');status.textContent='Listening...';}else{mic.classList.remove('bg-red-600');pulse.classList.add('hidden');status.textContent='';}}
async function doTranslate(t){if(!t.trim())return;out.textContent='Translating with NLLB-200...';badge.textContent='NLLB-200...';try{const r=await fetch('/api/translate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:t,srcLang:src.value,tgtLang:tgt.value})});const d=await r.json();out.textContent=d.translated||'';badge.textContent=d.engine||'NLLB-200';addBubble(true,t);addBubble(false,d.translated||'');try{const u=new SpeechSynthesisUtterance(d.translated||'');speechSynthesis.speak(u);}catch{}}catch{out.textContent='Error';}}
$('go').onclick=()=>doTranslate(inp.value);inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();doTranslate(inp.value);}});$('swap').onclick=()=>{const a=src.value;src.value=tgt.value;tgt.value=a;};$('copy').onclick=async()=>{await navigator.clipboard.writeText(out.textContent);};$('speak').onclick=()=>{speechSynthesis.speak(new SpeechSynthesisUtterance(out.textContent));};
function initRecog(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return null;const r=new SR();r.lang=src.value==='en'?'en-US':'my-MM';r.onstart=()=>setListening(true);r.onend=()=>{setListening(false);if(r._final)doTranslate(r._final);};r.onresult=e=>{r._final=e.results[0][0].transcript;};return r;}
mic.onclick=()=>{if(listening){try{recog.stop();}catch{}return;}recog=initRecog();if(!recog)return;recog._final='';try{recog.start();}catch{}};
</script>
</body>
</html>
