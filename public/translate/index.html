<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NqAI Translate - 1-Click Voice</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
body{font-family:Inter,sans-serif;background:#fcfcf9}
</style>
</head>
<body class="min-h-screen flex justify-center p-4">
<div class="w-full max-w-[640px]">
<div class="text-center py-6">
<h1 class="text-3xl font-bold">NqAI Translate</h1>
<div class="mt-2 inline-block bg-black text-white text-xs px-3 py-1 rounded-full">Powered by NLLB-200 • 1-Click Voice</div>
<p class="text-xs text-gray-500 mt-2">Better than Google - No second tap</p>
</div>
<div class="bg-white rounded-3xl shadow-sm border p-4">
<div class="flex gap-2">
<select id="src" class="flex-1 p-3 rounded-xl border bg-gray-50 text-sm"><option value="en">English</option><option value="es">Spanish</option><option value="my">Burmese</option><option value="zom" selected>Zomi</option></select>
<button onclick="swapLang()" class="px-3 rounded-full border">⇄</button>
<select id="tgt" class="flex-1 p-3 rounded-xl border bg-gray-50 text-sm"><option value="en" selected>English</option><option value="es">Spanish</option><option value="zom">Zomi</option></select>
</div>
<textarea id="input" placeholder="Type or tap mic..." class="w-full mt-4 min-h-[110px] p-4 rounded-2xl bg-gray-50 border-0 focus:ring-2 focus:ring-black outline-none"></textarea>
<div id="output" class="w-full mt-3 min-h-[110px] p-4 rounded-2xl bg-black text-white">Translation appears here...</div>
<div class="mt-6 flex flex-col items-center">
<button id="micBtn" onclick="toggleMic()" class="w-20 h-20 rounded-full bg-black text-white text-3xl flex items-center justify-center">🎤</button>
<p id="micLabel" class="mt-3 font-bold text-sm">1-Click Conversation</p>
<p class="text-xs text-gray-500 text-center mt-1">Tap once → Auto translates both ways → No second tap!</p>
<button onclick="doTranslate()" class="mt-4 w-full py-3.5 rounded-xl bg-black text-white font-semibold">Translate</button>
</div>
<div id="history" class="mt-4 space-y-2"></div>
</div>
<p class="text-center text-xs text-gray-400 mt-4">nqai.llc/translate • No Language Left Behind</p>
</div>
</div>
<script>
let listening=false,rec=null
function swapLang(){let a=src.value;src.value=tgt.value;tgt.value=a}
async function doTranslate(t){
  const text=t||input.value
  if(!text)return
  output.innerText='Translating with NLLB-200...'
  try{
    const r=await fetch('/api/translate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,srcLang:src.value,tgtLang:tgt.value})})
    const d=await r.json()
    output.innerText=d.translated||text
    const h=document.createElement('div')
    h.className='text-xs p-2 bg-gray-50 rounded'
    h.innerHTML='<b>You:</b> '+text+' → <span class=text-blue-600>'+d.translated+'</span> <span class=text-xs>('+d.engine+')</span>'
    history.prepend(h)
    speechSynthesis.speak(new SpeechSynthesisUtterance(d.translated))
  }catch(e){
    // fallback
    try{
      const from=src.value==='zom'?'my':src.value
      const to=tgt.value==='zom'?'my':tgt.value
      const r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(text)+'&langpair='+from+'|'+to)
      const d=await r.json()
      output.innerText=d.responseData.translatedText
    }catch{output.innerText=text}
  }
}
function toggleMic(){
  if(listening){try{rec.stop()}catch{};listening=false;micBtn.innerText='🎤';micBtn.className='w-20 h-20 rounded-full bg-black text-white text-3xl flex items-center justify-center';micLabel.innerText='1-Click Conversation';return}
  const SR=webkitSpeechRecognition||SpeechRecognition
  if(!SR){alert('Use Chrome');return}
  rec=new SR()
  rec.lang=src.value==='es'?'es-ES':'en-US'
  rec.onstart=()=>{listening=true;micBtn.innerText='■';micBtn.className='w-20 h-20 rounded-full bg-red-500 text-white text-2xl flex items-center justify-center animate-pulse';micLabel.innerText='Listening...'}
  rec.onend=()=>{if(listening)setTimeout(()=>{try{rec.start()}catch{}},800)}
  rec.onresult=e=>{const txt=e.results[0][0].transcript;input.value=txt;doTranslate(txt)}
  rec.start()
}
</script>
</body>
</html>
