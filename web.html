<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NqAI Web - Burmese Readable</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;700&family=Padauk:wght@400;700&display=swap" rel="stylesheet">
<style>
body{font-family:system-ui; padding:20px; max-width:900px; margin:auto; background:#fafafa}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
button,input,select{padding:12px 14px; border-radius:10px; border:1px solid #ccc; font-size:16px}
button{cursor:pointer}
.black{background:black; color:white}
#out{font-size:48px; font-weight:700; margin-top:20px; line-height:1.6; font-family:"Noto Sans Myanmar","Padauk","Myanmar Text",sans-serif; word-break:break-word}
#out.mya{font-family:"Noto Sans Myanmar","Padauk","Myanmar Text",sans-serif !important; font-size:52px; line-height:1.8}
.card{background:white; border:1px solid #e5e5e5; border-radius:16px; padding:16px; margin-top:12px}
.small{color:#666; font-size:14px}
</style>
</head>
<body>
<h1>NqAI Web - Phone-(Twilio+Web)-Phone</h1>
<p class="small">Zomi 500 + Spanish + Burmese Unicode GOOD - Lexnary 117 verified</p>
<div class="card">
<div class="row">
<button onclick="listen()">🎤 Speak English</button>
<input id="txt" value="How are you" style="width:280px" />
<select id="tgt">
<option value="zomi">Zomi - tui</option>
<option value="spa">Spanish</option>
<option value="mya" selected>Burmese - မင်္ဂလာပါ</option>
</select>
<button onclick="doTranslate()" class="black">Translate + Speak</button>
</div>
<div id="out" class="mya">နေကောင်းလား</div>
<div id="info" class="small" style="margin-top:8px"></div>
<div id="readable" class="small" style="margin-top:10px; padding:10px; background:#f0f7ff; border-radius:8px; display:none"></div>
<div class="card" style="background:#fffbe6; margin-top:16px">
<b>🎙️ Native Fix - Accent bad? Fix it:</b>
<div class="row" style="margin-top:10px">
<button onclick="recordFix()" id="recBtn" style="background:#ff4d4f; color:white">🔴 Record Good Accent</button>
<button onclick="playFix()">▶️ Play</button>
<button onclick="saveFix()" class="black">💾 Save Fix</button>
</div>
<audio id="audio" controls style="width:100%; margin-top:10px; display:none"></audio>
<div id="fixStatus" class="small" style="color:green; margin-top:6px"></div>
</div>
</div>
<script>
async function doTranslate(){
  const text=document.getElementById('txt').value.trim();
  const target=document.getElementById('tgt').value;
  if(!text) return;
  const r=await fetch(`/api/translate?text=${encodeURIComponent(text)}&target=${target}`);
  const d=await r.json();
  const outEl=document.getElementById('out');
  outEl.innerText=d.translated||"";
  outEl.className=target==="mya"?"mya":"";
  document.getElementById('info').innerText=`Result: ${text} → ${d.translated} | ${d.provider}`;
  const readEl=document.getElementById('readable');
  if(target==="mya"){readEl.style.display='block'; readEl.innerHTML=`<b>Burmese Unicode:</b> ${d.translated}<br><b>Roman:</b> Ne kaung la?`;}else{readEl.style.display='none';}
  const key=`fix-${target}-${d.translated}`;
  const saved=localStorage.getItem(key);
  if(saved && saved.startsWith('data:audio')){
    const audio=document.getElementById('audio'); audio.src=saved; audio.style.display='block'; audio.play();
    document.getElementById('fixStatus').innerText='✅ Native fix playing';
    return;
  }
  if(d.translated){const u=new SpeechSynthesisUtterance(d.translated); u.lang=target==="mya"?"my-MM":target==="spa"?"es-ES":"en-US"; speechSynthesis.speak(u);}
}
function listen(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR){alert("Use Chrome"); return;} const rec=new SR(); rec.lang="en-US"; rec.onresult=e=>document.getElementById('txt').value=e.results[0][0].transcript; rec.start();}
let fixBlob=null, mediaRec=null, chunks=[];
async function recordFix(){
  const btn=document.getElementById('recBtn');
  if(mediaRec && mediaRec.state==="recording"){mediaRec.stop(); btn.innerText="🔴 Record Good Accent"; return;}
  chunks=[]; const stream=await navigator.mediaDevices.getUserMedia({audio:true});
  mediaRec=new MediaRecorder(stream); mediaRec.ondataavailable=e=>chunks.push(e.data);
  mediaRec.onstop=()=>{fixBlob=new Blob(chunks,{type:'audio/webm'}); const url=URL.createObjectURL(fixBlob); const audio=document.getElementById('audio'); audio.src=url; audio.style.display='block'; audio.play(); document.getElementById('fixStatus').innerText='✅ Recorded - Save now';};
  mediaRec.start(); btn.innerText="⏹️ Stop"; document.getElementById('fixStatus').innerText='🔴 Recording...';
}
function playFix(){document.getElementById('audio').play();}
async function saveFix(){
  if(!fixBlob){alert("Record first"); return;}
  const text=document.getElementById('out').innerText; const target=document.getElementById('tgt').value;
  const reader=new FileReader(); reader.onloadend=async()=>{const base64=reader.result; localStorage.setItem(`fix-${target}-${text}`, base64); document.getElementById('fixStatus').innerText='🚀 Saved for everyone + 3-way voice'; try{await fetch('/api/fix',{method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({text, target, audio:base64})});}catch(e){}};
  reader.readAsDataURL(fixBlob);
}
</script>
</body>
</html>
